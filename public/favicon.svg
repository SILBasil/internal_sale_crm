  <circle cx="185" cy="160" r="5" fill="#34d399" />
  <!-- Large Bold CRM Text -->
  <text x="256" y="400" font-family="Arial Black, sans-serif" font-weight="900" font-size="110" fill="white" text-anchor="middle" letter-spacing="-4">CRM</text>
